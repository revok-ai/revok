[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revok"
version = "0.3.0"
description = "Event-driven memory validity layer for AI agents"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Roberto Perez", email = "robertopc@gmail.com" }
]
keywords = [
    "ai", "agent", "memory", "proxy", "entity-extraction",
    "langgraph", "crewai", "mem0", "llm", "rag", "validity"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "networkx>=3.2,<4",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.0,<4",
]

[project.optional-dependencies]
falkordb-lite = ["falkordblite"]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-timeout>=2.3,<3",
    "ruff==0.16.4",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/robertopc1/revok"
Repository = "https://github.com/robertopc1/revok"
Issues = "https://github.com/robertopc1/revok/issues"
Changelog = "https://github.com/robertopc1/revok/blob/master/CHANGELOG.md"

[project.scripts]
revok = "revok.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["revok*"]

[tool.pytest.ini_options]
timeout = 10
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Pinned explicitly: ruff changed its implicit defaults in 0.16, which silently
# widened the gate and broke CI. Widening this set is a deliberate decision.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true