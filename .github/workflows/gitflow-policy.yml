name: Git Flow Policy

on:
  pull_request:
    branches: [main, develop]

jobs:
  enforce-gitflow:
    name: Enforce Git Flow branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch for PRs to develop
        if: github.base_ref == 'develop'
        run: |
          SOURCE="${{ github.head_ref }}"
          if [[ "$SOURCE" =~ ^(feature|hotfix|release)/ ]]; then
            echo "✓ '$SOURCE' is allowed to merge into develop."
          else
            echo "✗ Branch '$SOURCE' cannot merge into develop."
            echo "  Allowed prefixes: feature/, hotfix/, release/"
            exit 1
          fi

      - name: Check source branch for PRs to main
        if: github.base_ref == 'main'
        run: |
          SOURCE="${{ github.head_ref }}"
          if [[ "$SOURCE" =~ ^(release|hotfix)/ ]]; then
            echo "✓ '$SOURCE' is allowed to merge into main."
          else
            echo "✗ Branch '$SOURCE' cannot merge into main."
            echo "  Allowed prefixes: release/, hotfix/"
            exit 1
          fi
