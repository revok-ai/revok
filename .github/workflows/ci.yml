name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check revok/ tests/
      - name: Mypy
        run: mypy revok/
      - name: Pytest
        run: pytest tests/ -v
      - name: OSS boundary check
        run: |
          if grep -rn \
            "import azure\|import boto3\|import botocore\|from google.cloud\|import confluent_kafka" \
            revok/ tests/ --include="*.py"; then
            echo "❌ Forbidden enterprise import detected"
            exit 1
          else
            echo "✅ No forbidden enterprise imports found"
          fi
