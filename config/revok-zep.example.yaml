# Revok — Zep Community Edition adapter example
# Copy to revok.yaml and point upstream.url at your Zep CE instance.
#
# What Revok does in Zep mode:
#   - Intercepts:  POST /api/v1/sessions/{sessionId}/memory
#   - Extracts entities from messages[].content, updates confidence scores
#   - Forwards original request bytes byte-identical to Zep CE
#   - Pass-through: everything else (GET, DELETE, PATCH, unmatched paths)

server:
  host: "127.0.0.1"
  port: 8080
  startup_timeout_seconds: 10
  max_signal_size_bytes: 1048576

adapter_type: zep

upstream:
  # Base URL of your Zep CE instance.
  url: "http://localhost:8001"
  # HTTP methods that trigger entity enrichment on the session-memory path.
  write_methods:
    - "POST"

# entity_matcher is optional.
# Use catalog mode for known entities (recommended):
entity_matcher:
  entities:
    - id: "alice"
      display_name: "Alice"
      aliases:
        - "Alice"
    - id: "bob"
      display_name: "Bob"
      aliases:
        - "Bob"

  # Or use pattern mode for open-ended text extraction:
  # patterns:
  #   - name: "person"
  #     regex: "\\b[A-Z][a-z]+\\b"

  # Or send X-Revok-Entity: <id> header and omit entity_matcher entirely.

scoring:
  half_life_seconds: 86400
  signal_strength: 0.3
  score_cap: 1.0
  # Time window (seconds) within which two conflicting values for the same
  # entity are treated as a contradiction. Default: 300 (5 minutes).
  contradiction_window_seconds: 300
  # Additional confidence penalty applied when a contradiction is detected,
  # on top of the normal signal_strength deduction. Default: 0.15.
  contradiction_penalty: 0.15

state_store:
  sqlite_path: "./revok_zep_state.db"
  hot_layer_max_entries: 1000

logging:
  level: "DEBUG"
  format: "%(asctime)s %(name)s %(levelname)s %(message)s"
