server:
  host: "0.0.0.0"
  port: 7771
  startup_timeout_seconds: 10
  max_signal_size_bytes: 1048576

upstream:
  url: "http://mem0:8000"
  write_methods:
    - "POST"
    - "PUT"
    - "PATCH"
  write_paths:
    - "/memories"

# ---------------------------------------------------------------------------
# entity_matcher (alias catalog — optional when callers send X-Revok-Entity)
# ---------------------------------------------------------------------------
# The  X-Revok-Entity: <id>  request header always takes priority over text
# matching.  The catalog below is the fallback and doubles as documentation
# of every product id the demo uses.
entity_matcher:
  entities:
    - id: "orion_cache"
      display_name: "Orion Cache"
      aliases:
        - "Orion Cache"
        - "orion-cache"
        - "ORC-PRO"
    - id: "nova_gateway"
      display_name: "Nova Gateway"
      aliases:
        - "Nova Gateway"
        - "nova-gateway"
        - "NVG-STD"
    - id: "atlas_search"
      display_name: "Atlas Search"
      aliases:
        - "Atlas Search"
        - "atlas-search"
        - "ATS-ENT"
    - id: "titan_queue"
      display_name: "Titan Queue"
      aliases:
        - "Titan Queue"
        - "titan-queue"
        - "TTQ-PLUS"
    - id: "spark_store"
      display_name: "Spark Store"
      aliases:
        - "Spark Store"
        - "spark-store"
        - "SPK-OBJ"

scoring:
  # half_life_seconds: time for confidence to decay to 0.5 after a signal
  # 43200 = 12 hours  |  600 = 10 min for demos  |  120 = 2 min  |  30 = very fast
  half_life_seconds: 90
  signal_strength: 0.8
  score_cap: 1.0

state_store:
  sqlite_path: "/data/revok_crewai_demo.db"
  hot_layer_max_entries: 1000

logging:
  level: "INFO"
  format: "%(asctime)s %(name)s %(levelname)s %(message)s"
