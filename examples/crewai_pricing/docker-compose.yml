name: revok-crewai-pricing-demo

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  mem0:
    build:
      context: .
      dockerfile: Dockerfile.mem0
    ports:
      - "${MEM0_HOST_PORT:-7770}:8000"
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}
      AZURE_OPENAI_LLM_DEPLOYMENT: ${AZURE_OPENAI_LLM_DEPLOYMENT:-gpt-4o-mini}
      AZURE_OPENAI_EMBEDDER_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDER_DEPLOYMENT:-text-embedding-ada-002}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDER_MODEL: ${OPENAI_EMBEDDER_MODEL:-text-embedding-3-small}
      QDRANT_HOST: revok-crewai-pricing-demo-qdrant-1
      QDRANT_PORT: "6333"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  revok:
    build:
      context: ../..
      dockerfile: examples/crewai_pricing/Dockerfile.revok
    ports:
      - "${REVOK_HOST_PORT:-7771}:7771"
    volumes:
      - ./revok.yaml:/app/revok.yaml:ro
      - revok_data:/data
    depends_on:
      mem0:
        condition: service_healthy

volumes:
  revok_data:
